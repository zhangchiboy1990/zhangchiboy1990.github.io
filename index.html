<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>地球城市缩放演示</title>
  <style>
    :root {
      --bg: #030712;
      --panel: rgba(15, 23, 42, 0.78);
      --line: rgba(148, 163, 184, 0.28);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --glow: #22d3ee;
      --busy: #f59e0b;
      --quiet: #334155;
      --scale: 1;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "PingFang SC", "Inter", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 20% 10%, #0f172a 0%, #020617 45%, #000 100%);
      overflow: hidden;
      display: grid;
      place-items: center;
    }

    .app {
      width: min(1100px, 96vw);
      height: min(760px, 95vh);
      border-radius: 22px;
      border: 1px solid var(--line);
      background: linear-gradient(145deg, rgba(2, 6, 23, 0.8), rgba(15, 23, 42, 0.55));
      box-shadow: 0 40px 80px rgba(0, 0, 0, 0.55);
      overflow: hidden;
      position: relative;
    }

    .toolbar {
      position: absolute;
      z-index: 30;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px 14px;
      backdrop-filter: blur(8px);
    }

    .toolbar h1 {
      margin: 0 10px 0 0;
      font-size: 1rem;
      letter-spacing: .02em;
    }

    .toolbar small { color: var(--muted); }

    input[type="range"] { width: min(260px, 70vw); accent-color: var(--glow); }

    button {
      border: 1px solid rgba(34, 211, 238, .4);
      color: var(--text);
      background: rgba(34, 211, 238, .16);
      border-radius: 10px;
      padding: 7px 12px;
      cursor: pointer;
    }

    .scene { position: absolute; inset: 0; }

    .globe-view,
    .detail-view {
      position: absolute;
      inset: 0;
      transition: opacity .7s ease, transform .8s ease;
    }

    .globe-view {
      opacity: calc(1 - min(1, (var(--scale) - 1) * 1.1));
      transform: scale(calc(1 + (var(--scale) - 1) * 0.2));
      display: grid;
      place-items: center;
    }

    .globe {
      width: clamp(280px, 42vw, 470px);
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(circle at 30% 25%, rgba(255,255,255,.23), transparent 24%),
        radial-gradient(circle at 40% 55%, rgba(57,189,248,.24), transparent 38%),
        repeating-radial-gradient(circle at 50% 50%, rgba(15,118,110,.2) 0 3px, rgba(30,41,59,.4) 4px 9px),
        radial-gradient(circle at 62% 50%, #0ea5e9 0%, #0f766e 35%, #0f172a 70%);
      box-shadow: inset -40px -25px 65px rgba(2, 6, 23, .75), 0 0 80px rgba(56, 189, 248, .28);
      position: relative;
      animation: spin 20s linear infinite;
      overflow: hidden;
    }

    .globe::before,
    .globe::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
    }

    .globe::before {
      background:
        radial-gradient(ellipse at 28% 58%, rgba(16, 185, 129, .6) 0 16%, transparent 17%),
        radial-gradient(ellipse at 50% 44%, rgba(16, 185, 129, .52) 0 12%, transparent 13%),
        radial-gradient(ellipse at 70% 40%, rgba(16, 185, 129, .48) 0 15%, transparent 16%);
      filter: blur(1px);
    }

    .globe::after {
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.2) 48%, transparent 54%);
      transform: translateX(-100%);
      animation: cloudDrift 8s ease-in-out infinite;
      opacity: .48;
    }

    @keyframes spin { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }
    @keyframes cloudDrift {
      0%,100% { transform: translateX(-100%); }
      55% { transform: translateX(100%); }
    }

    .detail-view {
      opacity: clamp(0, (var(--scale) - 1.35) * 1.2, 1);
      transform: scale(calc(0.92 + (var(--scale) - 1) * 0.06));
      pointer-events: none;
      display: grid;
      place-items: center;
    }

    .city {
      width: min(920px, 94vw);
      height: min(620px, 82vh);
      border-radius: 20px;
      border: 1px solid rgba(56, 189, 248, .34);
      background:
        radial-gradient(circle at 55% 52%, rgba(251, 191, 36, .18) 0%, rgba(15, 23, 42, .15) 32%, rgba(2, 6, 23, .6) 74%),
        linear-gradient(0deg, rgba(2,6,23,.75), rgba(2,6,23,.2));
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 80px rgba(0, 0, 0, .45), 0 0 50px rgba(34, 211, 238, .2);
    }

    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 56px 56px;
      opacity: .45;
    }

    .ring {
      position: absolute;
      border: 1px dashed rgba(251,191,36,.42);
      border-radius: 50%;
      pointer-events: none;
      animation: pulse 5s ease-in-out infinite;
    }

    .ring.center { width: 300px; height: 300px; left: calc(50% - 150px); top: calc(50% - 150px); }
    .ring.outer { width: 540px; height: 540px; left: calc(50% - 270px); top: calc(50% - 270px); opacity: .55; }
    @keyframes pulse {
      0%,100% { transform: scale(1); opacity: .45; }
      50% { transform: scale(1.04); opacity: .75; }
    }

    .building {
      --h: 100;
      --x: 50;
      --y: 50;
      --tone: var(--busy);
      position: absolute;
      left: calc(var(--x) * 1%);
      top: calc(var(--y) * 1%);
      width: 18px;
      height: calc(var(--h) * 1px);
      transform: translate(-50%, -100%);
      background: linear-gradient(180deg, rgba(255,255,255,.42), color-mix(in oklab, var(--tone), #0f172a 35%) 18%, #020617 100%);
      border: 1px solid rgba(148, 163, 184, .35);
      box-shadow: 0 0 10px color-mix(in oklab, var(--tone), black 70%);
    }

    .building::after {
      content: "";
      position: absolute;
      inset: 6px 3px;
      background: repeating-linear-gradient(
        180deg,
        rgba(253, 224, 71, .78) 0 2px,
        transparent 2px 6px
      );
      opacity: .65;
      animation: twinkle 2.8s steps(2) infinite;
    }

    .landmark { width: 26px; border-color: rgba(251,191,36,.65); }
    .landmark::before {
      content: attr(data-name);
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      white-space: nowrap;
      color: #fde68a;
      text-shadow: 0 0 8px rgba(0,0,0,.6);
    }

    .quiet { --tone: var(--quiet); }
    .quiet::after { opacity: .22; }

    @keyframes twinkle { 0%,100% { opacity: .35; } 50% { opacity: .9; } }

    .roads {
      position: absolute; inset: 0;
      background:
        linear-gradient(120deg, transparent 48%, rgba(248,250,252,.16) 49%, rgba(248,250,252,.12) 50%, transparent 52%),
        linear-gradient(20deg, transparent 42%, rgba(248,250,252,.12) 43%, rgba(248,250,252,.09) 44%, transparent 46%);
      opacity: .6;
    }

    .legend {
      position: absolute;
      right: 16px;
      bottom: 16px;
      z-index: 25;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 6px;
    }

    .hint {
      position: absolute;
      left: 20px;
      bottom: 18px;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="toolbar">
      <h1>地球 → 上海陆家嘴局部缩放</h1>
      <small id="status">视角：全球</small>
      <input id="zoom" type="range" min="1" max="3" step="0.01" value="1" />
      <button id="autoZoom">自动拉近</button>
    </div>

    <div class="scene">
      <section class="globe-view">
        <div class="globe"></div>
      </section>

      <section class="detail-view">
        <div class="city" id="city">
          <div class="grid"></div>
          <div class="roads"></div>
          <div class="ring center"></div>
          <div class="ring outer"></div>
        </div>
      </section>
    </div>

    <div class="legend">
      <div><span class="dot" style="background:#f59e0b"></span>城市中心：楼群密集、灯光活跃</div>
      <div><span class="dot" style="background:#334155"></span>外围区域：楼宇稀疏、亮度较低</div>
    </div>
    <div class="hint">滚轮或滑块可缩放；当倍率 ≥ 2.0 时可观察局部细节</div>
  </div>

  <script>
    const city = document.getElementById('city');
    const zoom = document.getElementById('zoom');
    const statusText = document.getElementById('status');
    const autoBtn = document.getElementById('autoZoom');

    const buildings = [
      { x: 51, y: 52, h: 220, tone: 'var(--busy)', cls: 'landmark', name: '上海中心' },
      { x: 54, y: 55, h: 190, tone: 'var(--busy)', cls: 'landmark', name: '环球金融中心' },
      { x: 48, y: 56, h: 170, tone: 'var(--busy)', cls: 'landmark', name: '金茂大厦' },
      { x: 46, y: 50, h: 130, tone: 'var(--busy)' },
      { x: 44, y: 56, h: 110, tone: 'var(--busy)' },
      { x: 58, y: 51, h: 125, tone: 'var(--busy)' },
      { x: 60, y: 56, h: 102, tone: 'var(--busy)' },
      { x: 52, y: 62, h: 98, tone: 'var(--busy)' },
      { x: 39, y: 45, h: 70, tone: 'var(--quiet)', cls: 'quiet' },
      { x: 32, y: 52, h: 64, tone: 'var(--quiet)', cls: 'quiet' },
      { x: 27, y: 60, h: 52, tone: 'var(--quiet)', cls: 'quiet' },
      { x: 67, y: 63, h: 58, tone: 'var(--quiet)', cls: 'quiet' },
      { x: 76, y: 47, h: 46, tone: 'var(--quiet)', cls: 'quiet' },
      { x: 81, y: 57, h: 42, tone: 'var(--quiet)', cls: 'quiet' },
      { x: 21, y: 34, h: 38, tone: 'var(--quiet)', cls: 'quiet' },
      { x: 84, y: 34, h: 36, tone: 'var(--quiet)', cls: 'quiet' },
      { x: 52, y: 35, h: 74, tone: 'var(--busy)' },
      { x: 58, y: 38, h: 80, tone: 'var(--busy)' },
      { x: 63, y: 41, h: 68, tone: 'var(--busy)' },
      { x: 42, y: 62, h: 76, tone: 'var(--busy)' }
    ];

    for (const b of buildings) {
      const el = document.createElement('div');
      el.className = `building ${b.cls || ''}`;
      el.style.setProperty('--x', b.x);
      el.style.setProperty('--y', b.y);
      el.style.setProperty('--h', b.h);
      el.style.setProperty('--tone', b.tone);
      if (b.name) el.setAttribute('data-name', b.name);
      city.appendChild(el);
    }

    function updateView(v) {
      document.documentElement.style.setProperty('--scale', v);
      statusText.textContent = v < 1.8
        ? '视角：全球'
        : v < 2.4
          ? '视角：东亚区域 → 上海'
          : '视角：陆家嘴核心区（中心繁荣 / 外围冷清）';
    }

    zoom.addEventListener('input', (e) => updateView(e.target.value));

    let playing = false;
    autoBtn.addEventListener('click', () => {
      if (playing) return;
      playing = true;
      autoBtn.textContent = '缩放中...';
      let t = Number(zoom.value);
      const timer = setInterval(() => {
        t += 0.04;
        if (t >= 3) {
          t = 3;
          clearInterval(timer);
          playing = false;
          autoBtn.textContent = '自动拉近';
        }
        zoom.value = t.toFixed(2);
        updateView(zoom.value);
      }, 20);
    });

    window.addEventListener('wheel', (e) => {
      e.preventDefault();
      const next = Math.max(1, Math.min(3, Number(zoom.value) + (e.deltaY > 0 ? -0.06 : 0.06)));
      zoom.value = next.toFixed(2);
      updateView(zoom.value);
    }, { passive: false });

    updateView(zoom.value);
  </script>
</body>
</html>
